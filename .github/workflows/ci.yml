# CLAUDE.md §1.20: "After each phase: typecheck, lint, unit/integration
# tests, E2E tests where applicable, accessibility checks, security
# review, docs update." Everything in that list a machine can decide runs
# here, in the same order and with the same commands used locally, so a
# green local run and a green CI run mean the same thing.
name: CI

on:
  push:
    # Both names deliberately. The repository's default branch is the one
    # git created it with, and a workflow that lists only the branch
    # somebody meant to have does not fail — it silently never runs, which
    # is the worst of the three possible outcomes.
    branches: [main, master]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # The same image tag as docker-compose.yml. Pinned deliberately:
      # every table's primary key defaults to PostgreSQL 18's native
      # uuidv7() (db/schema/*.ts), so a drifting `postgres:latest` could
      # pass here and fail on the household's actual deployment, or the
      # reverse.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: medfamily
          POSTGRES_USER: medfamily
          POSTGRES_PASSWORD: ci-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medfamily -d medfamily"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://medfamily:ci-not-a-secret@localhost:5432/medfamily
      # Throwaway, for a database that exists for the length of this job.
      # Real deployments generate this per CLAUDE.md §12 and .env.example;
      # no real secret is ever committed or needed to run these gates.
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: "1"

      # Required, not optional, despite what .env.example says.
      #
      # .env.example describes these as needed "only once an integration is
      # connected". That is true of a household's deployment and false of
      # this job: 44 unit/integration tests and 11 end-to-end tests
      # exercise connecting, sealing, opening and rotating integration
      # credentials, and every one of them fails without a keyring —
      # `getKeyring()` throws and the connect button never enables.
      #
      # This was measured by stripping a local .env down to exactly what
      # this file sets and running the suite: 44 failed, 776 passed. Adding
      # this one variable back returned it to 820 passed.
      #
      # The value is a throwaway that decodes to the ASCII string
      # "ci-only-not-a-real-key-012345678", which is what a key must be:
      # exactly 32 bytes. It is written out rather than stored as a GitHub
      # secret on purpose — a secret reference would imply something real
      # is kept here, and an obviously fake constant tells the truth.
      # A household's real key is generated per .env.example and never
      # goes near a repository.
      CREDENTIAL_KEYS: v1:Y2ktb25seS1ub3QtYS1yZWFsLWtleS0wMTIzNDU2Nzg=
      CREDENTIAL_ACTIVE_KEY: v1

      # HA_READONLY_TOKEN is deliberately absent. Leaving it unset disables
      # /api/ha/summary rather than opening it, and tests/e2e/ha-journey
      # asserts that disabled behaviour — so setting one here would remove
      # the coverage rather than add any.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's runtime image, so CI exercises the
          # Node major the household actually runs rather than whatever is
          # newest.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `next-env.d.ts` points at generated route types. Generating them
      # without a full build keeps the typecheck an early, fast gate.
      - name: Typecheck
        run: pnpm exec next typegen && pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        # Both E2E projects are Chromium-based (Desktop Chrome and the
        # Pixel 7 emulation), so the other engines are not downloaded.
        run: pnpm exec playwright install --with-deps chromium

      # Runs against the standalone bundle the Dockerfile ships — see
      # scripts/serve-standalone.mjs. This is also where the axe-core
      # accessibility checks live (tests/e2e/accessibility.spec.ts), which
      # is why there is no separate accessibility job.
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # CLAUDE.md §12: "dependency and container scanning". A separate job
  # because it needs neither a database nor a browser, and because a
  # failing scan should be legible on its own rather than buried at the end
  # of a thirty-minute quality run.
  #
  # Both gates fail the build on HIGH and above and report everything else.
  # The threshold is a judgement, and the judgement is that a gate which
  # fires on things nobody can act on is a gate people learn to ignore.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The advisory database moves without the lockfile changing, so this
      # is the one gate that can start failing on a commit that altered
      # nothing. That is the point of it.
      #
      # Its first run found a HIGH SQL-injection advisory against the
      # pinned drizzle-orm, which is exactly the class of thing nobody
      # notices by reading their own code.
      - name: Dependency scan
        run: pnpm scan:deps

      # Scanning the image that actually ships, not the source tree: the
      # base image's own packages are most of a container's attack surface
      # and none of them appear in a lockfile.
      - name: Build the image
        run: docker build -t med-family-os:ci .

      - name: Container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: med-family-os:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          # Unfixed findings are reported by the step above this one in
          # the log but do not fail the build: there is nothing to do
          # about a vulnerability with no available patch except choose a
          # different base image, which is a deliberate decision and not
          # something a red build should force at 2am.
          ignore-unfixed: true
          exit-code: "1"

      # The same scan without the gate, so the unfixed findings are still
      # visible to somebody deciding whether the base image is still the
      # right one.
      - name: Container scan (informational, including unfixed)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: med-family-os:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
