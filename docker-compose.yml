services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - reverse-proxy
    expose:
      - "3000"

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: medfamily
      POSTGRES_USER: medfamily
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medfamily -d medfamily"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

networks:
  app:
    internal: true
  reverse-proxy:
    external: true

volumes:
  postgres-data:
